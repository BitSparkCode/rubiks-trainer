<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>rubiks-trainer demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>rubiks-trainer</h1>
      <span id="timer" class="timer">0:00.0</span>
      <span id="status" class="status">solving — move auto-detect on</span>
    </header>

    <main>
      <section class="cube-pane">
        <canvas id="cube3d"></canvas>
        <div class="pane-label">virtual cube — mirrors your hold</div>
      </section>

      <aside class="side">
        <div class="cam-wrap">
          <canvas id="fakecam"></canvas>
        </div>

        <div class="controls">
          <button id="btn-cam">Stop camera</button>
          <button id="btn-rescan">Rescan</button>
          <label class="toggle">
            <input type="checkbox" checked />
            move auto-detection
          </label>
        </div>

        <div id="solve-panel">
          <div id="next-move" class="next-move">–</div>
          <div class="controls">
            <button id="btn-next">Did it →</button>
            <button id="btn-undo">Undo</button>
          </div>
          <ol id="move-list" class="move-list"></ol>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
